<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stuff Quiz Knowledge Conquest</title>
  <script>
    // Set the theme attribute before first paint (and before style.css is
    // even requested) so there's no flash of the wrong theme on load.
    (function () {
      var stored = localStorage.getItem("theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-text">
        <h1>Stuff Quiz Knowledge Conquest</h1>
        <p class="subtitle">Build a custom trivia quiz from Stuff.co.nz's daily quizzes</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <main>
      <!-- SETUP SCREEN -->
      <section id="setup-screen" class="card">
        <div class="cache-info" id="cache-info">Loading quiz data…</div>

        <form id="setup-form">
          <div class="field-row">
            <div class="field">
              <label for="start_date">From</label>
              <input type="date" id="start_date" name="start_date" required />
            </div>
            <div class="field">
              <label for="end_date">To</label>
              <input type="date" id="end_date" name="end_date" required />
            </div>
          </div>

          <div class="field">
            <label for="num_questions">Number of questions</label>
            <input type="number" id="num_questions" name="num_questions" min="1" max="50" value="10" />
          </div>

          <div class="field">
            <label>Quiz types</label>
            <div class="picklist">
              <label class="checkbox-pill">
                <input type="checkbox" name="series" value="morning" checked />
                <span>Morning Trivia</span>
              </label>
              <label class="checkbox-pill">
                <input type="checkbox" name="series" value="afternoon" checked />
                <span>Afternoon Trivia</span>
              </label>
            </div>
          </div>

          <button type="submit" id="generate-btn" class="btn-primary">Generate Quiz</button>
        </form>

        <div id="error-box" class="error-box hidden"></div>
      </section>

      <!-- LOADING SCREEN -->
      <section id="loading-screen" class="card hidden">
        <div class="spinner"></div>
        <p>Preparing your quiz…</p>
      </section>

      <!-- QUIZ SCREEN (styled to match riddle.com's own quiz player) -->
      <section id="quiz-screen" class="card riddle-quiz hidden">
        <div class="riddle-media" id="riddle-media">
          <img id="question-image" alt="" class="hidden" />
          <div class="riddle-topbar">
            <div class="riddle-pager">
              <span id="progress-label" aria-hidden="true">1 / 10</span>
              <span id="progress-label-sr" class="sr-only"></span>
            </div>
            <div class="riddle-score-pill" role="status" aria-live="polite">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0.707108 5.12132C0.316584 5.51184 0.316584 6.14501 0.707108 6.53553L3.53554 9.36396C3.92606 9.75449 4.55922 9.75449 4.94975 9.36396L10.6066 3.70711C10.9971 3.31658 10.9971 2.68342 10.6066 2.29289C10.2161 1.90237 9.58291 1.90237 9.19239 2.29289L4.24264 7.24264L2.12132 5.12132C1.7308 4.7308 1.09763 4.7308 0.707108 5.12132Z"/></svg>
              <span id="score-value">0</span>
            </div>
          </div>
        </div>
        <div class="quiz-meta" id="quiz-meta"></div>
        <h2 id="question-text" class="question-text"></h2>
        <div id="options-list" class="options-list riddle-choices"></div>
        <div class="next-btn-wrap">
          <button id="next-btn" class="btn-next hidden">Next</button>
        </div>
      </section>

      <!-- RESULTS SCREEN -->
      <section id="results-screen" class="card hidden">
        <h2 id="results-heading"></h2>
        <div id="results-list" class="results-list"></div>
        <button id="restart-btn" class="btn-primary">New Quiz</button>
      </section>
    </main>

    <footer class="app-footer">
      Questions sourced from <a href="https://www.stuff.co.nz/quizzes" target="_blank" rel="noopener">stuff.co.nz/quizzes</a>.
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
